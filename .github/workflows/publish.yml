name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment: nuget
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
      
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build and pack
        run: |
          # We don't need to specify PackageId here as it's in the project file
          dotnet build src/Blake2Fast/Blake2Fast.csproj -c Release -p:Version=${{ steps.get_version.outputs.VERSION }}
          dotnet pack src/Blake2Fast/Blake2Fast.csproj -c Release -p:Version=${{ steps.get_version.outputs.VERSION }} --output nuget-packages
      
      - name: Run tests
        run: dotnet test tests/Blake.Test -c Release
      
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: rawriclark

      - name: Push to NuGet
        run: dotnet nuget push nuget-packages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json